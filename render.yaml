databases:
  - name: finledger-db
    plan: free
    databaseName: finledger
    user: finledger

services:
  - type: web
    name: finledger-backend
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finledger-db
          property: connectionString
      - key: AUTO_CREATE_DB
        value: "false"
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_ALLOW_SIGNUP
        value: "true"
      - key: CORS_ORIGINS
        value: "https://frontend-sable-three-wjp5cltfij.vercel.app,http://localhost:3000"
      - key: FINLEDGER_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DEFAULT_CURRENCY
        value: INR
      - key: AUTH_SECRET
        generateValue: true
      - key: UPLOAD_ENCRYPTION_KEY
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: "https://api.groq.com/openai/v1/chat/completions"
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: HINDSIGHT_URL
        sync: false
      - key: HINDSIGHT_API_KEY
        sync: false
